#!KAMAILIO
# Vocivo SIP edge: registrar + fork for internal AORs, PSTN to FreeSWITCH, media via RTPEngine.
# Authentication is Digest verified by the Vocivo API. SIP passwords never live in this image.

#!define FLT_NATS 1
#!define FLT_ACC 2
#!define FLT_FS 3
# The request came in over the WebSocket port, from one of the apps.
#!define FLT_WS 4

# Written by docker-entrypoint.sh from PUBLIC_IP. Binding 0.0.0.0 without an
# advertised address put 0.0.0.0 into every Record-Route this edge added, so
# the carrier could never deliver its ACK for an answered call: FreeSWITCH
# re-sent the 200 OK until Timer H ran out and hung up — every inbound call
# ended at exactly 32 seconds, mid-sentence.
include_file "/etc/kamailio/listen.cfg"

# L_INFO and up. The script's own INVITE and inbound lines are L_INFO, and at
# the default level not one of them ever reached the log: the first calls
# over the trunk could not be found in it at all.
debug=2

alias=sip.vocivo.app

tcp_accept_no_cl=yes

loadmodule "jsonrpcs.so"
loadmodule "kex.so"
loadmodule "corex.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "db_sqlite.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "tsilo.so"
loadmodule "dialog.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "nathelper.so"
loadmodule "rtpengine.so"
loadmodule "http_client.so"
# Bound cold auth/replay work below the SIP transaction deadline. HTTP failures
# still return 503; the API minimizes serial database round trips.
modparam("http_client", "connection_timeout", 10)
loadmodule "async.so"
loadmodule "jansson.so"
loadmodule "auth.so"
loadmodule "uac.so"
loadmodule "dispatcher.so"
loadmodule "xhttp.so"
loadmodule "websocket.so"
# is_ip_in_subnet, for matching a carrier signalling range rather than a
# single address: Telnyx publishes /26s and /29s, not a list of hosts.
loadmodule "ipops.so"
# Call records for the calls that never touch FreeSWITCH (extension to
# extension): persisted in SQLite as they happen, posted to the API by a timer.
loadmodule "sqlops.so"
loadmodule "rtimer.so"
loadmodule "htable.so"

modparam("sqlops", "sqlcon", "cdrdb=>sqlite:///var/lib/kamailio/cdr.db")
modparam("rtimer", "timer", "name=cdr;interval=1;mode=1;")
modparam("rtimer", "exec", "timer=cdr;route=CDR_FLUSH")
# Which live dialogs are ours to record: set on the INVITE, cleared on BYE,
# expired after four hours so a lost BYE cannot pin memory.
modparam("htable", "htable", "cdr=>size=10;autoexpire=14400;")
# Per-AOR queues of suspended transaction IDs. Each entry carries its own
# deadline; the table TTL only collects abandoned queues.
modparam("htable", "htable", "wake=>size=10;autoexpire=90;")
# One counter per source address, for the REGISTER path on the public ports.
# updateexpire=0 makes the entry expire a minute after it was created rather
# than a minute after it was last touched, so this is a fixed window that a
# steady scanner cannot keep alive forever — and a client that trips it is
# forgiven a minute later rather than blocked for as long as it keeps trying.
modparam("htable", "htable", "regrate=>size=10;autoexpire=60;updateexpire=0;initval=0;")

modparam("usrloc", "db_url", "sqlite:////var/lib/kamailio/usrloc.db")
modparam("usrloc", "db_mode", 1)
modparam("usrloc", "handle_lost_tcp", 1)
modparam("usrloc", "close_expired_tcp", 1)
modparam("async", "workers", 16)
modparam("registrar", "method_filtering", 1)
modparam("registrar", "append_branches", 1)
modparam("registrar", "max_contacts", 8)
modparam("usrloc", "use_domain", 1)
modparam("tsilo", "use_domain", 1)
modparam("dialog", "dlg_match_mode", 1)
modparam("registrar", "received_avp", "$avp(RECEIVED)")
modparam("nathelper", "received_avp", "$avp(RECEIVED)")
modparam("rtpengine", "rtpengine_sock", "udp:127.0.0.1:2223")
modparam("dispatcher", "list_file", "/etc/kamailio/dispatcher.list")
modparam("tm", "fr_timer", 30000)
modparam("tm", "fr_inv_timer", 120000)
modparam("websocket", "keepalive_mechanism", 1)
modparam("websocket", "keepalive_timeout", 25)
modparam("websocket", "cors_mode", 2)
modparam("sanity", "autodrop", 0)

event_route[xhttp:request] {
    if ($Rp != 8080) {
        xhttp_reply("403", "Forbidden", "", "");
        exit;
    }
    if (!ws_handle_handshake()) {
        xlog("L_WARN", "websocket handshake failed from $si\n");
        exit;
    }
}

route {
    $var(auth_stale) = 0;
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }
    # Validate every transport. 1383 is the previous 1511 mask minus the
    # Content-Length check (128): required headers, SIP version/scheme,
    # CSeq method/value, Expires and Request-URI/From/To parsing.
    # Keep the native WebSocket Content-Length compatibility exception
    # limited to that check; it must not bypass header validation.
    if (!sanity_check("1383", "7")) {
        xlog("L_WARN", "malformed SIP from $si\n");
        # sanity sends its own error response; do not send a second one.
        exit;
    }
    if ($Rp != 8080 && !sanity_check("128", "7")) {
        xlog("L_WARN", "malformed SIP from $si $rm $rU\n");
        exit;
    }

    if (is_method("OPTIONS")) {
        sl_send_reply("200", "OK");
        exit;
    }

    # Every X-Vocivo header is something this edge tells the switch behind it
    # about a call it has already authorised, and none of them may arrive from
    # the network. They used to: the script only added its own when the sender
    # had not already supplied one, and never touched the rest. A client could
    # therefore claim X-Vocivo-Flow: inbound and walk into another tenant's
    # inbound plan, put any number on the world's caller ID displays with
    # X-Vocivo-Caller-ID, or reach a shell on the media host through the route
    # id the hangup hook quotes. They are removed here, once, before any route
    # reads them, and put back below only with values the API vouched for.
    #
    # Read before anything is removed, so the routes below never depend on
    # whether a removed header can still be read back.
    route(ROUTE_TOKEN);

    # Loopback port 5060 is FreeSWITCH placing a leg to a phone, and its
    # headers are ours. Everything else — the carrier on public 5060, the apps
    # on the WebSocket port — is the network.
    if ($Rp == 8080 || $si != "127.0.0.1") {
        route(UNTRUST_ROUTING);
        # The carrier's own signalling addresses are the exception, and only
        # for the headers that describe who is calling: on the Call Control
        # path it is the API that set them, on a call it had already decided,
        # and the callee's phone draws its incoming-call screen from them.
        route(TRUNK_SOURCE);
        if ($var(from_trunk) != 1) {
            route(UNTRUST_IDENTITY);
        }
    }

    if ($Rp == 8080) {
        setflag(FLT_WS);
    }

    if (nat_uac_test("64") || $Rp == 8080) {
        force_rport();
        if (is_method("REGISTER")) {
            fix_nated_register();
        } else if (!add_contact_alias()) {
            xlog("L_WARN", "websocket contact alias failed from $si $rm $rU proto=$proto rp=$Rp\n");
        }
    }

    if (!is_method("ACK|CANCEL")) {
        if (t_precheck_trans()) {
            t_check_trans();
            exit;
        }
        t_check_trans();
    }

    if (is_method("REGISTER")) {
        route(REGISTER);
        exit;
    }

    if (is_method("INVITE|ACK|BYE|CANCEL|UPDATE|PRACK")) {
        if (nat_uac_test("19")) {
            setflag(FLT_NATS);
            force_rport();
        }
    }

    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            # The caller gave up before the answer: free the media ports.
            rtpengine_manage();
            if ($sht(cdr=>$ci) != $null) {
                $var(cdr_flow) = "";
                $var(cdr_ruser) = $rU;
                $var(cdr_rtok) = $var(rtok);
                $var(cdr_event) = "cancel";
                route(CDR_ENQUEUE);
                $sht(cdr=>$ci) = $null;
            }
            route(RELAY);
        }
        exit;
    }

    # Dialog requests carry a remote Contact URI, not the original dialled
    # extension or its one-use route grant. Match the tracked dialog first.
    if (has_totag()) {
        if (!loose_route()) {
            if (is_method("ACK")) {
                if (t_check_trans()) route(RELAY);
                exit;
            }
            sl_send_reply("481", "Call Does Not Exist");
            exit;
        }
        # A dialog this proxy does not remember (restarted mid-call, or the
        # dialog module never saw the INVITE) still gets its ACK and BYE
        # delivered: refusing them here is what leaves both sides on a dead
        # call, and the ACK for a 200 OK has no transaction to check against.
        if (!is_known_dlg()) {
            xlog("L_NOTICE", "in-dialog $rm for a dialog not on record ci=$ci ru=$ru\n");
            if (!is_method("ACK|BYE|INVITE|UPDATE|PRACK|INFO|OPTIONS")) {
                sl_send_reply("481", "Call Does Not Exist");
                exit;
            }
        }
        # FreeSWITCH lives on loopback only. Whatever host its Contact named,
        # a request for port 5080 goes to 127.0.0.1:5080 — the profile used to
        # advertise the public address, where nothing listens, so the carrier's
        # ACK and every BYE toward the switch went into the void and FreeSWITCH
        # tore the call down when its ACK timer ran out.
        if ($rp == "5080") {
            $du = "sip:127.0.0.1:5080;transport=udp";
            setflag(FLT_FS);
            force_send_socket(udp:0.0.0.0:5060);
        }
        if (is_method("ACK|BYE")) {
            xlog("L_INFO", "in-dialog $rm ci=$ci from $si:$sp to $rd:$rp du=$du\n");
        }
        # No SIP transfer path currently issues tenant-scoped admission grants.
        if (is_method("REFER")) {
            sl_send_reply("403", "Transfer not authorised");
            exit;
        }
        if (is_method("INVITE|UPDATE|PRACK|ACK")) {
            t_on_reply("MANAGE_REPLY");
            if (has_body("application/sdp")) {
                # Convert the offer for its actual destination, including
                # carrier-originated renegotiation and aliased WebRTC peers.
                handle_ruri_alias();
                if ($du =~ "transport=ws" || ($du == $null && $ru =~ "transport=ws")) {
                    rtpengine_manage("replace-origin replace-session-connection ICE=force DTLS=passive SDES-off rtcp-mux-offer rtcp-mux-require UDP/TLS/RTP/SAVPF");
                } else {
                    rtpengine_manage("replace-origin replace-session-connection RTP/AVP");
                }
                if (!t_relay()) sl_reply_error();
                exit;
            }
        }
        # Nothing here released rtpengine's ports when a call ended, so every
        # call held four of them until rtpengine's own timeout — and with a
        # hundred ports in the pool, "Ran out of ports" arrived within a day.
        if (is_method("BYE")) {
            rtpengine_manage();
            if ($sht(cdr=>$ci) != $null) {
                $var(cdr_flow) = "";
                $var(cdr_ruser) = $rU;
                $var(cdr_rtok) = $var(rtok);
                $var(cdr_event) = "bye";
                route(CDR_ENQUEUE);
                $sht(cdr=>$ci) = $null;
            }
        }
        route(RELAY);
        exit;
    }

    if (is_method("INVITE")) {
        t_on_reply("MANAGE_REPLY");
        route(INVITE);
        exit;
    }

    if (is_method("REFER|NOTIFY")) {
        sl_send_reply("403", "Dialog required");
        exit;
    }

    sl_send_reply("405", "Method Not Allowed");
}

# Written by docker-entrypoint.sh from VOCIVO_TRUNK_SOURCES. Defines
# route[TRUNK_SOURCE], which sets $var(from_trunk) for a carrier address.
include_file "/etc/kamailio/trunk-sources.cfg"

route[REGISTER] {
    $var(auth_stale) = 0;
    # Cache replies for UDP retransmissions; do not spend a Digest twice.
    if (!t_newtran()) exit;
    # UDP scanners hammer numeric From-users. Do not spend sip-auth (or async
    # workers) on them or WebSocket REGISTER from vocivo.app stalls with 1006.
    if ($Rp != 8080 && $fU =~ "^[0-9]{1,8}$") {
        send_reply("403", "Forbidden");
        exit;
    }
    # That guard only ever caught the numeric usernames. admin, sip, test and
    # voip walked straight into CHALLENGE, whose first act is a blocking
    # http_client_query to the API from the SIP worker itself — ten seconds of
    # connection timeout while it is unwell — so one scanner on the open 5060
    # held every worker at once and the app's WebSocket REGISTERs waited behind
    # them until the browser gave up with a 1006. Deriving the nonce here would
    # remove the call altogether, but the API signs it with AUTH_SECRET, the key
    # behind every session cookie, and that key must not live on the droplet
    # that terminates the public 5060; a nonce key of its own would be a change
    # in the API. So the source is bounded instead: the phones and browsers
    # register over the WebSocket port and are never counted here, and no
    # address off the internet may spend more than this many API round trips a
    # minute on being told it has the wrong password.
    if ($Rp != 8080) {
        $sht(regrate=>$si) = $sht(regrate=>$si) + 1;
        if ($sht(regrate=>$si) > 10) {
            xlog("L_WARN", "rate limit: $si has spent 10 REGISTER attempts in a minute; refusing without asking the API\n");
            send_reply("403", "Forbidden");
            exit;
        }
    }
    xlog("L_WARN", "REGISTER $fU proto=$proto rp=$Rp cl=$cl\n");
    if (!is_present_hf("Authorization")) {
        xlog("L_WARN", "REGISTER challenge $fU\n");
        route(CHALLENGE);
        exit;
    }
    if (!route(AUTH)) {
        xlog("L_WARN", "REGISTER auth failed $fU\n");
        route(CHALLENGE);
        exit;
    }
    # Defense in depth before registrar.save, independent of API parsing.
    if ($au != $fU || $au != $tU || $fd != $env(VOCIVO_SIP_REALM) || $td != $env(VOCIVO_SIP_REALM)) {
        send_reply("403", "Registration identity mismatch");
        exit;
    }
    if (!save("location")) {
        xlog("L_WARN", "REGISTER save failed $fU contact=$ct\n");
        sl_reply_error();
        exit;
    }
    # Only this newly registered contact is appended. TSILO/TM deduplicate it
    # and refuse branches on transactions already cancelled or finally answered.
    route(RESUME_WAKE);
    ts_append_by_contact("location", "$tu");
    xlog("L_WARN", "REGISTER ok $fU from $si transport=$proto\n");
    exit;
}

route[CHALLENGE] {
    $var(body) = '{"username":"' + $(fU{s.escape.common}) + '"}';
    # Worker variables survive requests; missing JSON must not reuse a nonce.
    $var(nonce) = "";
    $var(chal) = "";
    $var(url) = "http://127.0.0.1:8081/sip-nonce";
    http_client_query($var(url), $var(body), "application/json", "$var(chal)");
    $var(nonce_http_status) = $rc;
    if ($var(nonce_http_status) != 200) {
        xlog("L_ERR", "sip-nonce unavailable status=$var(nonce_http_status)\n");
        send_reply("503", "Authentication service unavailable");
        exit;
    }
    jansson_get("nonce", "$var(chal)", "$var(nonce)");
    if (!($var(nonce) =~ "^[0-9]{1,12}[.][A-Za-z0-9_-]{20,}$")) {
        xlog("L_WARN", "sip-nonce response missing a valid nonce\n");
        send_reply("503", "Authentication service unavailable");
        exit;
    }
    if ($var(auth_stale) == 1) {
        append_to_reply("WWW-Authenticate: Digest realm=\"$env(VOCIVO_SIP_REALM)\", nonce=\"$var(nonce)\", algorithm=MD5, qop=\"auth\", stale=true\r\n");
    } else {
        append_to_reply("WWW-Authenticate: Digest realm=\"$env(VOCIVO_SIP_REALM)\", nonce=\"$var(nonce)\", algorithm=MD5, qop=\"auth\"\r\n");
    }
    send_reply("401", "Unauthorized");
    exit;
}

route[AUTH] {
    $var(auth_stale) = 0;
    $var(res) = "";
    $var(body) = '{"method":"' + $rm + '","authorization":"' + $(hdr(Authorization){s.escape.common}) + '","fromUser":"' + $(fU{s.escape.common}) + '","toUser":"' + $(tU{s.escape.common}) + '","fromDomain":"' + $(fd{s.escape.common}) + '","toDomain":"' + $(td{s.escape.common}) + '","requestUri":"' + $(ru{s.escape.common}) + '","requestUser":"' + $(rU{s.escape.common}) + '","routeToken":"' + $var(rtok) + '"}';
    $var(url) = "http://127.0.0.1:8081/sip-auth";
    http_client_query($var(url), $var(body), "application/json", "$var(res)");
    $var(auth_http_status) = $rc;
    # libcurl failures can be positive numbers below 100 (timeout is 28).
    # Never turn an unavailable service or malformed success into a password
    # challenge: clients otherwise rotate valid credentials and disrupt calls.
    if (($var(auth_http_status) != 200 && $var(auth_http_status) != 403)
            || !($var(res) =~ "^[{]")) {
        xlog("L_ERR", "sip-auth unavailable status=$var(auth_http_status)\n");
        append_to_reply("Retry-After: 5\r\n");
        send_reply("503", "Authentication service unavailable");
        exit;
    }
    $var(auth_ok) = -1;
    if (!jansson_get("ok", "$var(res)", "$var(auth_ok)")) {
        send_reply("503", "Invalid authentication service response");
        exit;
    }
    if ($var(auth_http_status) == 200 && $var(auth_ok) == 1) {
        route(READ_ROUTE);
        return 1;
    }
    if ($var(auth_http_status) != 403 || $var(auth_ok) != 0) {
        send_reply("503", "Invalid authentication service response");
        exit;
    }
    jansson_get("stale", "$var(res)", "$var(auth_stale)");
    xlog("L_WARN", "sip-auth rejected $fU: $var(res)\n");
    return -1;
}

# What the edge decides, and nobody else: where a call is going, what number it
# may present, and which authorisation it is spending. Removed from every
# request off this box, and put back below only with the API's own values —
# the route token included, so that what FreeSWITCH records is the token this
# script checked rather than whatever arrived under that name.
route[UNTRUST_ROUTING] {
    remove_hf("X-Vocivo-Flow");
    remove_hf("X-Vocivo-Carrier-Source");
    remove_hf("X-Vocivo-Caller-ID");
    remove_hf("X-Vocivo-Route-Token");
    remove_hf("X-Vocivo-Call-UUID");
    # Named in the call record. FreeSWITCH sets them on the legs it places
    # from loopback; from the network they are whatever the sender typed.
    remove_hf("X-Vocivo-Destination-Extension");
    remove_hf("X-Vocivo-Destination-Name");
}

# Who the callee is told is ringing. Nothing on this edge sets these — they
# belong to the carrier's Call Control path, where the API sets them — so a
# client sending them is a colleague's name and photograph on somebody else's
# phone.
route[UNTRUST_IDENTITY] {
    remove_hf("X-Vocivo-Route-ID");
    remove_hf("X-Vocivo-Call-Type");
    remove_hf("X-Vocivo-Caller-Name");
    remove_hf("X-Vocivo-Caller-Extension");
    remove_hf("X-Vocivo-Caller-Photo");
    remove_hf("X-Vocivo-Company-Name");
    remove_hf("X-Vocivo-Organization-ID");
}

# The signed authorisation /api/voice/route gave the client for this one call,
# taken off the message as it arrived. Only something shaped like a token is
# kept, so nothing a client invents reaches the API's parser — or the call
# record — as anything but an empty string.
route[ROUTE_TOKEN] {
    $var(rtok) = "";
    if ($(hdr(X-Vocivo-Route-Token)) =~ "^[A-Za-z0-9_-]+[.][A-Za-z0-9_-]+$") {
        $var(rtok) = $(hdr(X-Vocivo-Route-Token));
    }
}

# What the API said about that token: the route it belongs to and the number it
# may present. Both are re-checked against their own shape here, because the
# route id becomes an argument to a shell command on the media host and the
# caller ID becomes a P-Asserted-Identity on the trunk.
route[READ_ROUTE] {
    $var(auth_route_id) = "";
    $var(auth_caller_id) = "";
    jansson_get("routeId", "$var(res)", "$var(auth_route_id)");
    jansson_get("callerId", "$var(res)", "$var(auth_caller_id)");
    if (!($var(auth_route_id) =~ "^[A-Za-z0-9_-]{16,80}$")) {
        $var(auth_route_id) = "";
    }
    if (!($var(auth_caller_id) =~ "^\+[1-9][0-9]{6,14}$")) {
        $var(auth_caller_id) = "";
    }
}

# A call between two extensions carries no Digest of its own — the phone
# authenticated when it registered — so the route token is the whole of its
# authorisation. Without this an INVITE straight at the WebSocket port rang
# any extension on the platform, in any tenant, and woke its phone with a push.
route[ROUTE_CHECK] {
    if ($var(rtok) == "") {
        return -1;
    }
    $var(body) = '{"requestUser":"' + $(rU{s.escape.common}) + '","routeToken":"' + $var(rtok) + '"}';
    $var(res) = "";
    http_client_query("http://127.0.0.1:8081/sip-auth", $var(body), "application/json", "$var(res)");
    $var(route_http_status) = $rc;
    if ($var(route_http_status) == 403) return -1;
    if ($var(route_http_status) != 200) {
        xlog("L_ERR", "sip-auth unreachable for internal $rU\n");
        send_reply("503", "Call authorization service unavailable");
        exit;
    }
    route(READ_ROUTE);
    if ($var(auth_route_id) == "") {
        send_reply("503", "Invalid call authorization response");
        exit;
    }
    return 1;
}

route[INVITE] {
    if (!has_totag()) {
        record_route();
    }

    if ($rU =~ "^conf-") {
        sl_send_reply("403", "Conference admission required");
        exit;
    }

    if ($rU =~ "^\+?[0-9]{5,15}$") {
        # An E.164 destination on public 5060 is one of two things: a call the
        # carrier is delivering to one of our own DIDs, or somebody trying to
        # originate PSTN on our account. The only thing that separates them is
        # where it came from.
        route(TRUNK_SOURCE);
        if ($Rp != 8080 && $var(from_trunk) == 1 && $env(VOCIVO_SIP_INBOUND) == "1") {
            xlog("L_NOTICE", "inbound DID $rU from $fU via trunk $si ci=$ci\n");
            append_hf("X-Vocivo-Flow: inbound\r\n");
            append_hf("X-Vocivo-Carrier-Source: $si\r\n");
            rtpengine_manage("replace-origin replace-session-connection RTP/AVP");
            route(FORK_FS);
            exit;
        }

        # UDP/TCP 5060 is scanned. Only the authenticated WebSocket edge may
        # originate PSTN, and only the carrier's own signalling addresses may
        # deliver inbound. Everything else is refused.
        if ($Rp != 8080) {
            xlog("L_WARN", "reject unauthenticated E.164 INVITE from $si $rU rp=$Rp\n");
            sl_send_reply("403", "Forbidden");
            exit;
        }
        if (!is_present_hf("Authorization")) {
            route(CHALLENGE);
            exit;
        }
        if (!route(AUTH)) {
            route(CHALLENGE);
            exit;
        }
        # The password proves who is calling; it does not authorise the call.
        # /api/voice/route is where the plan, the outbound policy, the wallet
        # and the ownership of the caller ID are checked, and it signs all of
        # that into the route token the client presented — which nothing on
        # this edge used to look at. The caller ID and the route id below are
        # the API's own answer, not the client's headers.
        if ($var(auth_route_id) == "" || $var(auth_caller_id) == "") {
            xlog("L_WARN", "refusing outbound $rU from $fU: no authorised route for this call\n");
            sl_send_reply("403", "Call not authorised");
            exit;
        }
        append_hf("X-Vocivo-Flow: outbound\r\n");
        append_hf("X-Vocivo-Caller-ID: $var(auth_caller_id)\r\n");
        append_hf("X-Vocivo-Route-ID: $var(auth_route_id)\r\n");
        # The token goes on again in the shape this script checked, so the call
        # record FreeSWITCH writes cannot be broken by a hand-made header.
        append_hf("X-Vocivo-Route-Token: $var(rtok)\r\n");
        rtpengine_manage("replace-origin replace-session-connection RTP/AVP");
        route(FORK_FS);
        exit;
    }

    # Carrier delivery must pass the source gate before contact lookup or push.
    if ($Rp != 8080 && $si != "127.0.0.1") {
        route(TRUNK_SOURCE);
        if ($var(from_trunk) != 1) {
            sl_send_reply("403", "Forbidden");
            exit;
        }
        if ($rU =~ "^[A-Za-z][A-Za-z0-9_.-]{15,79}$") {
            # The same kill switch the E.164 branch above obeys. A carrier that
            # delivers to the internal SIP username rather than to the DID took
            # this branch, which asked only where the call came from: after an
            # operator ran disable-inbound the calls kept arriving and kept
            # waking devices, and nothing in the logs said inbound was still on.
            if ($env(VOCIVO_SIP_INBOUND) != "1") {
                xlog("L_WARN", "inbound is off: refusing carrier delivery to $rU from $si\n");
                sl_send_reply("403", "Inbound calling is disabled");
                exit;
            }
            route(DELIVER_EXTENSION);
            exit;
        }
        xlog("L_WARN", "reject untrusted internal INVITE from $si $rU rp=$Rp proto=$proto\n");
        sl_send_reply("403", "Forbidden");
        exit;
    }

    # Wake the iPhone, then fork whoever is already registered (usually web).
    xlog("L_INFO", "INVITE $fU -> $rU sip-wakeup then fork registered contacts\n");
    if ($Rp == 8080) {
        # From one of the apps, to a colleague. The registration was
        # authenticated; this call was not, until now — an INVITE at the
        # WebSocket port rang whatever extension it named, in whatever tenant,
        # and woke that phone with a push notification on the way.
        if (!route(ROUTE_CHECK)) {
            xlog("L_WARN", "refusing internal INVITE $fU -> $rU: no authorised route for this call\n");
            sl_send_reply("403", "Call not authorised");
            exit;
        }
        append_hf("X-Vocivo-Flow: internal\r\n");
        append_hf("X-Vocivo-Route-ID: $var(auth_route_id)\r\n");
        append_hf("X-Vocivo-Route-Token: $var(rtok)\r\n");
        # This call is relayed here and FreeSWITCH never sees it, so its record
        # has to start here. (Legs FreeSWITCH places to a phone arrive from
        # 127.0.0.1 and it records those itself.)
        $sht(cdr=>$ci) = 1;
        $var(cdr_event) = "invite";
        $var(cdr_flow) = "internal";
        $var(cdr_ruser) = $rU;
        $var(cdr_rtok) = $var(rtok);
        route(CDR_ENQUEUE);
    }
    route(DELIVER_EXTENSION);
    exit;
}

route[DELIVER_EXTENSION] {
    # Canonical AOR matches REGISTER's realm even for a loopback FS leg.
    $ru = "sip:" + $rU + "@" + $env(VOCIVO_SIP_REALM);
    $avp(wake_aor) = $ru;
    remove_hf("X-Vocivo-Call-UUID");
    append_hf("X-Vocivo-Call-UUID: $ci\r\n");
    dlg_manage();
    route(MEDIA_OFFER);
    if (!t_newtran()) exit;
    t_set_fr(45000, 45000);
    t_set_max_lifetime(45000, 45000);
    t_on_failure("MANAGE_FAILURE");
    # Serialize the no-contact check with REGISTER's pending-call drain. A
    # registration between lookup and suspension must not strand this INVITE.
    sht_lock("wake=>$avp(wake_aor)");
    if (lookup("location")) {
        route(DELIVER_REGISTERED);
        sht_unlock("wake=>$avp(wake_aor)");
    } else {
        # Prune expired IDs before adding this call, preserving simultaneous
        # callers to the same extension rather than overwriting one waiter.
        $var(waiters) = $sht(wake=>$avp(wake_aor));
        $var(live_waiters) = "";
        # Every entry ends in a pipe, and the substitution below eats one entry
        # per pass — unless the value has somehow lost its trailing pipe, in
        # which case the substitution matches nothing, the string never
        # shrinks and this loop spins forever inside a SIP worker. The count is
        # the only thing that could stop that, and 4096 bytes of entries is a
        # couple of hundred of them, so this bound is never reached by a queue
        # that is merely long.
        $var(scan) = 0;
        while ($var(waiters) != $null && $var(waiters) != "" && $var(scan) < 256) {
            $var(scan) = $var(scan) + 1;
            $var(waiter) = $(var(waiters){s.select,0,|});
            $var(waiters) = $(var(waiters){re.subst,/^[^|]*[|]//});
            if ($(var(waiter){s.select,0,:}{s.int}) > $Ts) {
                $var(live_waiters) = $var(live_waiters) + $var(waiter) + "|";
            }
        }
        if ($var(waiters) != $null && $var(waiters) != "") {
            xlog("L_ERR", "wake queue for $avp(wake_aor) is malformed and was truncated: $var(waiters)\n");
        }
        if ($(var(live_waiters){s.len}) > 4096) {
            sht_unlock("wake=>$avp(wake_aor)");
            rtpengine_delete();
            t_reply("486", "Too many pending calls");
            exit;
        }
        if (!t_suspend()) {
            sht_unlock("wake=>$avp(wake_aor)");
            rtpengine_delete();
            t_reply("500", "Call delivery unavailable");
            exit;
        }
        $var(wake_until) = $Ts + 45;
        $sht(wake=>$avp(wake_aor)) = $var(live_waiters) + $var(wake_until) + ":" + $T(id_index) + ":" + $T(id_label) + "|";
        sht_unlock("wake=>$avp(wake_aor)");
        # For as long as the push below takes to reach the phone, the app to
        # launch and its REGISTER to arrive, the caller had nothing but tm's
        # automatic 100 Trying — which no client displays and which starts no
        # ringback — while the callee's CallKit screen was already ringing from
        # that same push. Callers concluded the call had not been placed and
        # hung up on a phone that was ringing in someone's hand. This is the
        # one thing the caller is waiting to be told, and it is true: the push
        # that makes that phone ring goes out three lines below, in the same
        # breath, with nothing between here and there that can decide otherwise.
        #
        # It is issued after t_suspend, not before, and that ordering matters
        # twice. tm discards the replies a *branch* sends back while the
        # transaction is suspended, which is the trap RESUME_WAKE describes,
        # but a reply the script generates never goes through branch reply
        # handling and is sent immediately; and suspending first leaves in
        # place the 100 Trying that t_suspend itself sends, so the caller gains
        # a response instead of trading one away. The lock is released first
        # because this writes to the caller's socket, and a REGISTER for this
        # AOR must never wait behind that.
        #
        # No SDP: a 183 with early media would mean bridging audio through
        # FreeSWITCH for a call that otherwise never touches it, only to play a
        # ring tone the caller can generate locally. The receiver's own 180
        # still travels when it comes, under its own To-tag; that is a second
        # early dialog, which is exactly what any forking proxy produces and
        # what the eventual 200 OK resolves.
        t_reply("180", "Ringing");
    }
    route(WAKEUP_NOW);
    exit;
}

# REGISTER has saved its contact. Resume suspended transactions BEFORE TSILO
# appends contacts. While a transaction is T_ASYNC_SUSPENDED tm drops the
# replies that come back from its branches — the receiver's 180 Ringing and its
# 200 OK alike — and ts_append does not resume it, so a contact appended to a
# still-suspended transaction rings a phone whose answer nobody ever hears.
# That rule is about branch replies only. A reply the script sends itself is
# not relayed from a branch and reaches the caller normally, which is what lets
# DELIVER_EXTENSION give the caller 180 Ringing while it waits here.
route[RESUME_WAKE] {
    # The same AOR DELIVER_EXTENSION built, rather than the To-URI as it
    # arrived: a client whose REGISTER named sip:user@realm:5060, or added
    # ;transport=ws, keyed a queue nobody else would ever look in and its
    # pending calls sat suspended until they timed out. The identity check in
    # REGISTER has already established that the To-user and domain are this
    # registration's own, so the two spellings describe the same phone.
    $var(wake_key) = "sip:" + $tU + "@" + $env(VOCIVO_SIP_REALM);
    # An unregister must not consume calls still waiting for a real contact.
    if (!registered("location", "$var(wake_key)")) return;
    sht_lock("wake=>$var(wake_key)");
    $var(resume_waiters) = $sht(wake=>$var(wake_key));
    $sht(wake=>$var(wake_key)) = $null;
    sht_unlock("wake=>$var(wake_key)");
    # Bounded for the reason the pruning loop above is: an entry that lost its
    # trailing pipe makes the substitution a no-op, and this runs in the worker
    # that is holding a REGISTER.
    $var(resume_scan) = 0;
    while ($var(resume_waiters) != $null && $var(resume_waiters) != "" && $var(resume_scan) < 256) {
        $var(resume_scan) = $var(resume_scan) + 1;
        $var(resume_waiter) = $(var(resume_waiters){s.select,0,|});
        $var(resume_waiters) = $(var(resume_waiters){re.subst,/^[^|]*[|]//});
        if ($(var(resume_waiter){s.select,0,:}{s.int}) > $Ts) {
            $var(resume_index) = $(var(resume_waiter){s.select,1,:}{s.int});
            $var(resume_label) = $(var(resume_waiter){s.select,2,:}{s.int});
            t_continue("$var(resume_index)", "$var(resume_label)", "DELIVER_WAKE");
        }
    }
    if ($var(resume_waiters) != $null && $var(resume_waiters) != "") {
        xlog("L_ERR", "wake queue for $var(wake_key) is malformed; calls in $var(resume_waiters) were not resumed\n");
    }
}

route[DELIVER_WAKE] {
    if (t_is_canceled()) exit;
    # t_continue runs in a failure-route context. The saved offer is already
    # rewritten: running rtpengine_manage here would DELETE that media session.
    $ru = $avp(wake_aor);
    sht_lock("wake=>$avp(wake_aor)");
    if (!lookup("location")) {
        sht_unlock("wake=>$avp(wake_aor)");
        rtpengine_delete();
        t_reply("480", "Temporarily Unavailable");
        exit;
    }
    route(DELIVER_REGISTERED);
    sht_unlock("wake=>$avp(wake_aor)");
}

route[DELIVER_REGISTERED] {
    t_on_reply("MANAGE_REPLY");
    t_on_failure("MANAGE_FAILURE");
    if (!t_relay()) {
        rtpengine_delete();
        t_reply("500", "Call delivery unavailable");
        return;
    }
    # Hold the AOR lock from lookup through store. A concurrent REGISTER
    # saves its contact then waits on that lock before appending, so no late
    # contact falls into a lookup/store gap. TM deduplicates repeat contacts.
    ts_store("$avp(wake_aor)");
}

# One line per call event, keyed by Call-ID. The INVITE names the flow, the
# route the API issued for it and the callee; later events carry only the
# parties, and the API joins them by Call-ID.
#
# The flow is read from $var(cdr_flow), set by whichever route enqueued this,
# and not from the header: remove_hf takes a header off the message that is
# relayed, but $hdr() still reads the one that arrived, so a record built from
# the header would quote the client's claim rather than what the edge decided.
#
# The route token and the dialled user are read the same way, from variables
# the caller sets, because $var(...) belongs to a worker process rather than to
# a message and keeps its value until that process next writes it. A reply or a
# failure is handled by whichever process took it, not the one that ran
# ROUTE_TOKEN for that INVITE, so reading $var(rtok) there quoted whatever call
# that process had last seen — another tenant's authorisation in another
# tenant's call record — and $rU on a reply is not a Request-URI at all.
route[CDR_ENQUEUE] {
    # remove_hf leaves $hdr() readable, so the destination is taken from the
    # header only when the message came from FreeSWITCH on loopback.
    $var(cdr_dest_ext) = "";
    $var(cdr_dest_name) = "";
    if ($si == "127.0.0.1" && $Rp != 8080) {
        $var(cdr_dest_ext) = $(hdr(X-Vocivo-Destination-Extension));
        $var(cdr_dest_name) = $(hdr(X-Vocivo-Destination-Name));
    }
    # The route token and request user are read from variables this route set
    # for this transaction, not from $var(rtok)/$rU directly. A $var() is
    # private to the worker process and survives across messages, and replies
    # and failures run in whichever process took them — so a row written here
    # used to be able to quote the route token left behind by another tenant's
    # call, which is the same hazard the auth path documents.
    $var(cdr_body) = '{"source":"kamailio","event":"' + $var(cdr_event) + '","callId":"' + $(ci{s.escape.common}) + '","from":"' + $(fU{s.escape.common}) + '","to":"' + $(tU{s.escape.common}) + '","requestUser":"' + $(var(cdr_ruser){s.escape.common}) + '","flow":"' + $var(cdr_flow) + '","routeToken":"' + $(var(cdr_rtok){s.escape.common}) + '","destinationExtension":"' + $(var(cdr_dest_ext){s.escape.common}) + '","destinationName":"' + $(var(cdr_dest_name){s.escape.common}) + '","at":' + $TS + '}';
    sql_query("cdrdb", "PRAGMA busy_timeout=2000");
    # Hex encoding avoids embedding caller-controlled quotes in SQL.
    if (sql_query("cdrdb", "insert or ignore into outbox(body) values(CAST(X'$(var(cdr_body){s.encode.hexa})' AS TEXT))") < 0) {
        xlog("L_CRIT", "sip-cdr durable write failed\n");
    }
}

# Every second, in the timer process, so signalling never waits on the API.
route[CDR_FLUSH] {
    sql_query("cdrdb", "PRAGMA busy_timeout=2000");
    if (sql_query("cdrdb", "select id,body from outbox where next_at <= $TS order by id limit 50", "cdr_rows") < 0) return;
    $var(cdr_n) = 0;
    while ($var(cdr_n) < $dbr(cdr_rows=>rows)) {
        $var(cdr_id) = $dbr(cdr_rows=>[$var(cdr_n),0]);
        $var(cdr_payload) = $dbr(cdr_rows=>[$var(cdr_n),1]);
        http_client_query("http://127.0.0.1:8081/sip-cdr", "$var(cdr_payload)", "application/json", "$var(cdr_res)");
        $var(cdr_status) = $rc;
        if ($var(cdr_status) >= 200 && $var(cdr_status) < 300) {
            sql_query("cdrdb", "delete from outbox where id=$var(cdr_id)");
        } else {
            sql_query("cdrdb", "update outbox set attempts=attempts+1, next_at=$TS+60 where id=$var(cdr_id)");
            xlog("L_WARN", "sip-cdr delivery deferred status=$var(cdr_status)\n");
        }
        $var(cdr_n) = $var(cdr_n) + 1;
    }
    sql_result_free("cdr_rows");
}

route[FORK_FS] {
    dlg_manage();
    # Client/carrier Digest belongs to the ingress hop. FreeSWITCH will try to
    # authenticate any supplied Digest even with auth-calls=false, producing a
    # second challenge for credentials only the edge can validate. Admission
    # has already succeeded; the signed Vocivo route remains for XML binding.
    remove_hf("Authorization");
    remove_hf("Proxy-Authorization");
    # FreeSWITCH SIP is localhost-only so the public internet cannot hairpin PSTN.
    $ru = "sip:" + $rU + "@127.0.0.1:5080";
    $du = "sip:127.0.0.1:5080;transport=udp";
    $rd = "127.0.0.1";
    $rp = "5080";
    setflag(FLT_FS);
    force_send_socket(udp:0.0.0.0:5060);
    if (is_method("INVITE")) {
        t_on_failure("MANAGE_FAILURE");
    }
    route(RELAY);
}

route[WAKEUP_NOW] {
    $avp(uuid) = "";
    # Escaped, all four: a caller whose display name held a quote — "Musa
    # "Mo" Usman", or any name with an apostrophe — produced JSON the wakeup
    # endpoint could not parse, and the callee's phone was never pushed.
    # The deadline travels with the push, as an absolute time, because the two
    # ends were counting from different moments: this transaction dies 45
    # seconds after the INVITE, while the phone was told to ring for 45 seconds
    # from whenever the push happened to arrive. The push is always later, so
    # the phone rang on past the point where the caller had already been given
    # up on — and a call answered in that trailing window came up connected on
    # the handset with nobody on the other end, which is one of the ways a
    # caller reports being unable to hear. Anchored to the same instant, the
    # handset stops ringing exactly when the caller stops waiting.
    $var(body) = '{"username":"' + $(avp(wake_aor){uri.user}{s.escape.common}) + '","callId":"' + $(ci{s.escape.common}) + '","callerName":"' + $(fn{s.escape.common}) + '","from":"' + $(fU{s.escape.common}) + '","ringUntil":' + $var(wake_until) + '}';
    $var(url) = "http://127.0.0.1:8081/sip-wakeup";
    http_client_query($var(url), $var(body), "application/json", "$var(wake)");
    if ($var(wake) =~ "^\\{") {
        jansson_get("uuid", "$var(wake)", "$avp(uuid)");
    }
}

# For the transactions that have no wake-up retry: a failed call must not
# keep its media ports.
failure_route[MANAGE_FAILURE] {
    if (t_is_canceled()) exit;
    rtpengine_manage();
    if ($sht(cdr=>$ci) != $null) {
        $var(cdr_flow) = "";
        # Neither belongs to this message: see CDR_ENQUEUE.
        $var(cdr_ruser) = "";
        $var(cdr_rtok) = "";
        $var(cdr_event) = "failed";
        route(CDR_ENQUEUE);
        $sht(cdr=>$ci) = $null;
    }
}

# Only DELIVER_EXTENSION offers media through here, and everything it delivers
# to is a contact that registered over the WebSocket — the browser and the app,
# both WebRTC. It used to branch on FLT_FS as if a plain SIP callee were also
# possible, but FLT_FS is set by FORK_FS and by the in-dialog leg to port 5080,
# neither of which runs before this, so that branch was never taken and the
# script read as though it handled a case it did not. It is gone rather than
# left as a comforting lie: the day a non-WebRTC endpoint can register, the
# condition to add is the transport of the contact this lookup found, not a
# flag about where the request was forked.
route[MEDIA_OFFER] {
    rtpengine_manage("replace-origin replace-session-connection ICE=force DTLS=passive SDES-off rtcp-mux-offer rtcp-mux-require UDP/TLS/RTP/SAVPF");
}

onreply_route[MANAGE_REPLY] {
    # A phone on the WebSocket answers with a Contact nobody can route to
    # (sip:…@xxxx.invalid;transport=ws). Requests were aliased on the way in,
    # replies never were, so the caller's ACK and BYE for a call a web phone
    # *answered* went to an unresolvable host: the answering phone never saw
    # the ACK and tore the call down itself half a minute in.
    if ($Rp == 8080 || nat_uac_test("64")) {
        # A 4xx from a phone that declined carries no Contact and needs none,
        # so only the answer is worth a line: if the alias could not be put on
        # a 200 OK the caller's ACK and BYE are addressed to .invalid, the
        # answering phone hears nothing come back and drops the call it just
        # took. That looked exactly like "answered, but no audio", and nothing
        # in the log said which side had failed.
        if (!add_contact_alias() && status =~ "2[0-9][0-9]" && $rm == "INVITE") {
            xlog("L_WARN", "answer from $si could not be aliased; the caller's ACK for ci=$ci has nowhere to go\n");
        }
    }
    if (status == "200" && $rm == "INVITE" && $sht(cdr=>$ci) != $null) {
        $var(cdr_flow) = "";
        # Neither belongs to this message: see CDR_ENQUEUE.
        $var(cdr_ruser) = "";
        $var(cdr_rtok) = "";
        $var(cdr_event) = "answered";
        route(CDR_ENQUEUE);
    }
    if (has_body("application/sdp") && status =~ "18[0-9]|2[0-9][0-9]") {
        # The answer travels back to whoever sent the request, so it is
        # rewritten for *that* side. This used to key on FLT_FS — the flag
        # that marks a request forked to FreeSWITCH — which is the opposite
        # side: a phone that dialled out received FreeSWITCH's answer as plain
        # RTP/AVP with no DTLS fingerprint and no ICE, and connected to silence.
        if (isflagset(FLT_WS)) {
            rtpengine_manage("replace-origin replace-session-connection ICE=force DTLS=passive SDES-off rtcp-mux-offer rtcp-mux-require UDP/TLS/RTP/SAVPF");
        } else {
            rtpengine_manage("replace-origin replace-session-connection RTP/AVP");
        }
    }
}

route[RELAY] {
    if (is_method("CANCEL")) {
        if (!t_relay()) sl_reply_error();
        exit;
    }
    if (!isflagset(FLT_FS)) {
        handle_ruri_alias();
        if (!t_relay()) sl_reply_error();
        exit;
    }
    xlog("L_INFO", "RELAY FS $rm $fU -> $rU du=$du proto=$proto\n");
    if (!t_relay()) sl_reply_error();
    exit;
}
