services:
  rtpengine:
    # Pinned by digest like FreeSWITCH is. This container terminates DTLS-SRTP
    # for every browser leg, and `deploy` runs `docker compose pull`: on a
    # floating tag an upstream push would have swapped it under a live edge
    # between one ops action and the next, with nothing in the repository to
    # say what had changed. The tag is the one this edge has always run (the
    # image behind it was last pushed in March 2021); the digest is what makes
    # it immutable. To move it deliberately, read the new one with
    # `docker manifest inspect drachtio/rtpengine:latest` and change both here.
    image: drachtio/rtpengine:latest@sha256:d5bf3715baa197d89f89a70207d06d5509a4284b7392310a94a466ace07afb96
    restart: unless-stopped
    network_mode: host
    environment:
      PUBLIC_IP: ${PUBLIC_IP:-127.0.0.1}
    entrypoint: ["rtpengine"]
    command:
      - --interface=${PUBLIC_IP:-127.0.0.1}
      - --listen-ng=127.0.0.1:2223
      # Four ports per call. A hundred was twenty-five calls, and with leaked
      # sessions on top of that the pool ran dry within a day of going live.
      - --port-min=${RTP_START:-30000}
      - --port-max=${RTP_END:-39999}
      # A session that never carried media (a call nobody answered, an INVITE
      # that failed) is released after two minutes instead of an hour. It has
      # to outlast a wake-up ring, which is 45 seconds of no media at all
      # before the callee's phone even answers, plus the resume that follows:
      # at 60 seconds a caller who let it ring out was a few seconds away from
      # having the ports deleted underneath the call that was about to connect.
      - --timeout=120
      - --silent-timeout=120
      - --foreground
      - --log-level=5

  kamailio:
    image: ghcr.io/kamailio/kamailio-ci:5.8.4-alpine
    restart: unless-stopped
    network_mode: host
    depends_on:
      - rtpengine
      - freeswitch
    environment:
      VOCIVO_SIP_REALM: ${VOCIVO_SIP_REALM:-sip.vocivo.app}
      VOCIVO_API_URL: ${VOCIVO_API_URL:-https://vocivo.app}
      SIP_EDGE_SECRET: ${SIP_EDGE_SECRET:?SIP_EDGE_SECRET is required}
      PUBLIC_IP: ${PUBLIC_IP:-127.0.0.1}
      # Inbound over the trunk is refused unless both of these are set: the
      # flag, and the carrier signalling addresses it may arrive from.
      VOCIVO_SIP_INBOUND: ${VOCIVO_SIP_INBOUND:-0}
      VOCIVO_TRUNK_SOURCES: ${VOCIVO_TRUNK_SOURCES:-}
    volumes:
      - ./kamailio/kamailio.cfg:/etc/kamailio/kamailio.cfg:ro
      - ./kamailio/dispatcher.list:/etc/kamailio/dispatcher.list:ro
      - ./kamailio/usrloc-init.sql:/etc/kamailio/usrloc-init.sql:ro
      - ./kamailio/docker-entrypoint.sh:/entrypoint.sh:ro
      - kamailio-usrloc:/var/lib/kamailio
    entrypoint: ["/bin/sh", "/entrypoint.sh"]

  freeswitch:
    image: safarov/freeswitch@sha256:b31c743f4c911a19687c61e3214968f2a24f93f9d3d667cc26284192e158ffc6
    restart: unless-stopped
    network_mode: host
    environment:
      VOCIVO_API_URL: ${VOCIVO_API_URL:-https://vocivo.app}
      SIP_EDGE_SECRET: ${SIP_EDGE_SECRET:?SIP_EDGE_SECRET is required}
      TELNYX_SIP_HOST: ${TELNYX_SIP_HOST:-sip.telnyx.com}
      TELNYX_SIP_USERNAME: ${TELNYX_SIP_USERNAME:-}
      TELNYX_SIP_PASSWORD: ${TELNYX_SIP_PASSWORD:-}
      TELNYX_SIP_AUTH_TOKEN: ${TELNYX_SIP_AUTH_TOKEN:-}
      TELNYX_SIP_REALM: ${TELNYX_SIP_REALM:-sip.telnyx.com}
      PUBLIC_IP: ${PUBLIC_IP:-127.0.0.1}
      VOCIVO_SIP_INBOUND: ${VOCIVO_SIP_INBOUND:-0}
    volumes:
      - freeswitch-etc:/etc/freeswitch
      - freeswitch-cdr:/var/log/freeswitch/json_cdr
      - freeswitch-data:/var/lib/vocivo
      - ./freeswitch:/opt/vocivo-fs:ro
      # Operator-provisioned carrier gateways survive source synchronization.
      - /opt/vocivo/carriers:/opt/vocivo-carriers:ro
      # The image ships no CA bundle, so nothing in FreeSWITCH could speak
      # HTTPS to the API. The host's bundle stands in; the entrypoint also
      # copies it to /etc/freeswitch/tls/cacert.pem, where FreeSWITCH's own
      # modules look for one.
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
      # Shared with the receptionist container, which is deployed separately
      # by Ops · Droplets → receptionist-deploy: it writes the prompts
      # FreeSWITCH plays and reads the turns FreeSWITCH records, so the two
      # must see one path. It is not a compose service because its secrets
      # would then be required to bring up the whole stack — and a missing one
      # makes `docker compose config` reject the file, taking SIP down with it.
      - receptionist-audio:/var/lib/vocivo-receptionist
    entrypoint: ["/bin/sh", "/opt/vocivo-fs/docker-entrypoint.sh"]

  sip-outbox:
    image: python:3.12-alpine@sha256:b64631e04e4920160c50fbe8d8df828f7f35f06f425cb44aa09bca53e708a35a
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      VOCIVO_API_URL: ${VOCIVO_API_URL:-https://vocivo.app}
      SIP_EDGE_SECRET: ${SIP_EDGE_SECRET:?SIP_EDGE_SECRET is required}
      PYTHONDONTWRITEBYTECODE: '1'
    volumes:
      - ./freeswitch/outbox.py:/app/outbox.py:ro
      - freeswitch-cdr:/var/log/freeswitch/json_cdr
      - freeswitch-data:/var/lib/vocivo
    command: [python3, /app/outbox.py]

  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    network_mode: host
    command:
      - --log-file=stdout
      - --listening-port=3478
      - --external-ip=${PUBLIC_IP:-127.0.0.1}
      - --realm=${VOCIVO_SIP_REALM:-sip.vocivo.app}
      - --use-auth-secret
      # No default. "changeme" is a secret the whole internet knows, and this
      # relay is on a public address: anyone could mint a credential for it and
      # send their traffic through the droplet. Ops · Droplets → sync-config
      # writes a random one into .env when it finds none.
      - --static-auth-secret=${TURN_SECRET:?TURN_SECRET is required — sync-config generates one when it is missing}
      - --fingerprint
      - --no-cli
      - --no-tls
      - --no-dtls
      - --min-port=${TURN_RELAY_MIN_PORT:-49152}
      - --max-port=${TURN_RELAY_MAX_PORT:-65535}
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255

volumes:
  freeswitch-cdr:
  freeswitch-data:
  freeswitch-etc:
  kamailio-usrloc:
  receptionist-audio:
