# Local proxy so Kamailio can POST to Vocivo with the edge bearer secret.
# Installed on the droplet; not used as a public vhost.

server {
    listen 127.0.0.1:8081;
    server_name _;

    location = /sip-auth {
        proxy_pass https://vocivo.app/api/voice/sip-auth;
        include /etc/nginx/snippets/vocivo-sip-edge-proxy.conf;
    }

    location = /sip-wakeup {
        proxy_pass https://vocivo.app/api/voice/sip-wakeup;
        include /etc/nginx/snippets/vocivo-sip-edge-proxy.conf;
    }

    location = /sip-nonce {
        proxy_pass https://vocivo.app/api/voice/sip-nonce;
        include /etc/nginx/snippets/vocivo-sip-edge-proxy.conf;
    }

    # Call records for extension-to-extension calls, which Kamailio relays
    # itself. (FreeSWITCH posts its own records straight to the API.)
    location = /sip-cdr {
        proxy_pass https://vocivo.app/api/voice/sip-cdr;
        include /etc/nginx/snippets/vocivo-sip-edge-proxy.conf;
    }

    # The static fallback dialplan's routing lookup, for when mod_xml_curl gave
    # no answer. It comes through here rather than going to the API directly so
    # that the edge secret is not an argument to a dialplan action: FreeSWITCH
    # writes every application it runs, arguments expanded, into freeswitch.log,
    # and the ops actions read that file.
    location = /sip-inbound {
        proxy_pass https://vocivo.app/api/voice/sip-inbound;
        include /etc/nginx/snippets/vocivo-sip-edge-proxy.conf;
    }
}
