name: SIP protocol validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'services/sip/**'
      - '.github/workflows/sip-validation.yml'
      - 'frontend/api/_lib/features/numbers/**'
      - 'frontend/api/_lib/features/sip/**'
      - 'frontend/scripts/render-byoc-test.mjs'
  push:
    branches: [main]
    paths:
      - 'services/sip/**'
      - '.github/workflows/sip-validation.yml'
      - 'frontend/api/_lib/features/numbers/**'
      - 'frontend/api/_lib/features/sip/**'
      - 'frontend/scripts/render-byoc-test.mjs'

permissions:
  contents: read

jobs:
  temporary-relay:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate temporary carrier restrictions and isolated Digest/RTP
        run: |
          python3 -m unittest discover -s services/sip/tests -p 'test_*.py'
          python3 services/sip/tests/validate_outbox.py
          python3 services/sip/tests/validate_relay.py
          python3 services/sip/tests/validate_gateway_load.py
          python3 services/sip/tests/validate_forward_auth.py
          python3 services/sip/tests/validate_features.py
  ingress:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Parse production configuration and probe isolated SIP ingress
        run: |
          python3 services/sip/tests/validate_edge.py
          python3 services/sip/tests/validate_repairs.py
  tenant-carriers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: frontend
      - name: Test isolated carrier selection, caller ID, RTP and capacity
        run: python3 services/sip/tests/validate_byoc.py
