name: Ops · Vercel

# Manual operations against the Vercel project. Secrets never reach the log:
# only an allowlist of non-secret variable names is ever printed by "show".
#
# Required repository secret: VERCEL_TOKEN (Vercel account token, "musa263's projects" scope).
#
# sync-push-credentials additionally reads the mobile push credentials from the
# secrets store and copies them into Vercel. They travel secret-to-secret and are
# never a workflow input, so they do not appear in run metadata or in the log.
#
# sync-tts does the same for the self-hosted speech service, so the API stops
# falling back to the carrier's text-to-speech. Same rule: the bearer secret is
# read from the secrets store, never typed into a dispatch form.

on:
  # Also startable through the API with a token that can write the
  # repository's contents, for when the "Run workflow" form will not load:
  #   POST /repos/musa263/vocivo/dispatches
  #   {"event_type":"ops-vercel","client_payload":{"action":"...", ...}}
  # The payload keys mirror the inputs below and are validated the same way.
  repository_dispatch:
    types: [ops-vercel]
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        required: true
        type: choice
        options: [show, set, delete, redeploy, sync-push-credentials, sync-tts]
      name:
        description: Environment variable name (for show / set / delete)
        required: false
        type: string
      value:
        description: New value (for set). Leave blank for show / delete / redeploy.
        required: false
        type: string
      environment:
        description: Which Vercel environment(s)
        required: true
        type: choice
        default: production
        options: [production, preview, development, all]
      redeploy:
        description: Redeploy production after set/delete so the change takes effect
        required: false
        type: boolean
        default: true

concurrency:
  group: ops-vercel
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_jD7fFcfetmvjcQjSVYHqrSlu
  VERCEL_PROJECT_ID: prj_KpUUSMocbJHeVOnH2YCjRTW5L6IB

jobs:
  vercel:
    name: ${{ (inputs.action || github.event.client_payload.action) }} ${{ (inputs.name || github.event.client_payload.name) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate inputs
        env:
          ACTION: ${{ (inputs.action || github.event.client_payload.action) }}
          NAME: ${{ (inputs.name || github.event.client_payload.name) }}
          VALUE: ${{ (inputs.value || github.event.client_payload.value) }}
        run: |
          set -euo pipefail
          case "$ACTION" in
            show|set|delete|redeploy|sync-push-credentials|sync-tts) ;;
            *) echo "::error::unknown action '$ACTION'"; exit 1;;
          esac
          if [ "$ACTION" != "redeploy" ] && [ "$ACTION" != "sync-push-credentials" ] && [ "$ACTION" != "sync-tts" ]; then
            [[ "$NAME" =~ ^[A-Z][A-Z0-9_]{1,80}$ ]] || { echo "::error::name must look like VOCIVO_VOICE_EDGE"; exit 1; }
          fi
          if [ "$ACTION" = "set" ] && [ -z "$VALUE" ]; then echo "::error::set needs a value"; exit 1; fi
          # Never let a secret value appear in logs even by accident.
          if [ -n "$VALUE" ]; then echo "::add-mask::$VALUE"; fi

      - name: Show
        if: (inputs.action || github.event.client_payload.action) == 'show'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NAME: ${{ (inputs.name || github.event.client_payload.name) }}
          ENVIRONMENT: ${{ (inputs.environment || github.event.client_payload.environment || 'production') }}
        run: |
          set -euo pipefail
          [ -n "$VERCEL_TOKEN" ] || { echo "::error::VERCEL_TOKEN secret is missing (Settings → Secrets and variables → Actions)"; exit 1; }
          cd frontend
          SAFE_TO_PRINT="VOCIVO_VOICE_EDGE VOCIVO_SIP_INBOUND VOCIVO_SIP_DOMAIN VOCIVO_SIP_REALM VOCIVO_SIP_WSS_URI VITE_APP_URL TTS_SERVICE_URL WEB_PUSH_SUBJECT APNS_TOPIC APNS_TEAM_ID APNS_KEY_ID"
          for target in $([ "$ENVIRONMENT" = all ] && echo production preview development || echo "$ENVIRONMENT"); do
            npx --yes vercel@latest env pull ".env.ops.$target" --environment "$target" --yes --token "$VERCEL_TOKEN" >/dev/null
            line=$(grep -E "^${NAME}=" ".env.ops.$target" || true)
            if [ -z "$line" ]; then
              echo "$target: $NAME is NOT SET"
            elif echo " $SAFE_TO_PRINT " | grep -q " $NAME "; then
              echo "$target: $line" | sed 's/^\([^=]*\)="\(.*\)"$/\1=\2/'
            else
              echo "$target: $NAME is set (value hidden: not on the non-secret allowlist)"
            fi
            rm -f ".env.ops.$target"
          done | tee /tmp/show.txt
          { echo "### show $NAME"; echo; echo '```'; cat /tmp/show.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=show $NAME::$(tr '\n' ' ' < /tmp/show.txt)"

      - name: Set
        if: (inputs.action || github.event.client_payload.action) == 'set'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NAME: ${{ (inputs.name || github.event.client_payload.name) }}
          VALUE: ${{ (inputs.value || github.event.client_payload.value) }}
          ENVIRONMENT: ${{ (inputs.environment || github.event.client_payload.environment || 'production') }}
        run: |
          set -euo pipefail
          [ -n "$VERCEL_TOKEN" ] || { echo "::error::VERCEL_TOKEN secret is missing (Settings → Secrets and variables → Actions)"; exit 1; }
          cd frontend
          for target in $([ "$ENVIRONMENT" = all ] && echo production preview development || echo "$ENVIRONMENT"); do
            npx --yes vercel@latest env rm "$NAME" "$target" --yes --token "$VERCEL_TOKEN" >/dev/null 2>&1 || true
            printf '%s' "$VALUE" | npx --yes vercel@latest env add "$NAME" "$target" --token "$VERCEL_TOKEN" >/dev/null
            echo "$target: $NAME updated"
          done

      - name: Delete
        if: (inputs.action || github.event.client_payload.action) == 'delete'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NAME: ${{ (inputs.name || github.event.client_payload.name) }}
          ENVIRONMENT: ${{ (inputs.environment || github.event.client_payload.environment || 'production') }}
        run: |
          set -euo pipefail
          [ -n "$VERCEL_TOKEN" ] || { echo "::error::VERCEL_TOKEN secret is missing (Settings → Secrets and variables → Actions)"; exit 1; }
          cd frontend
          for target in $([ "$ENVIRONMENT" = all ] && echo production preview development || echo "$ENVIRONMENT"); do
            if npx --yes vercel@latest env rm "$NAME" "$target" --yes --token "$VERCEL_TOKEN" >/dev/null 2>&1; then
              echo "$target: $NAME removed"
            else
              echo "$target: $NAME was not set"
            fi
          done

      # Mobile push credentials are private keys. They are read from the secrets
      # store rather than taken as an input, because workflow_dispatch inputs are
      # visible in the run's metadata to anyone who can read the repository.
      - name: Sync push credentials
        if: (inputs.action || github.event.client_payload.action) == 'sync-push-credentials'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
          APNS_AUTH_KEY: ${{ secrets.APNS_AUTH_KEY }}
          APNS_TOPIC: ${{ secrets.APNS_TOPIC }}
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          [ -n "$VERCEL_TOKEN" ] || { echo "::error::VERCEL_TOKEN secret is missing"; exit 1; }
          cd frontend
          synced=0; skipped=""
          sync() {
            local name=$1 value=$2
            if [ -z "$value" ]; then skipped="$skipped $name"; return 0; fi
            echo "::add-mask::$value"
            for target in production preview; do
              npx --yes vercel@latest env rm "$name" "$target" --yes --token "$VERCEL_TOKEN" >/dev/null 2>&1 || true
              printf '%s' "$value" | npx --yes vercel@latest env add "$name" "$target" --token "$VERCEL_TOKEN" >/dev/null
            done
            echo "  $name -> production, preview (${#value} chars)"
            synced=$((synced+1))
          }
          echo "syncing mobile push credentials:"
          sync APNS_KEY_ID "$APNS_KEY_ID"
          sync APNS_TEAM_ID "$APNS_TEAM_ID"
          sync APNS_AUTH_KEY "$APNS_AUTH_KEY"
          sync APNS_TOPIC "$APNS_TOPIC"
          sync FCM_SERVICE_ACCOUNT "$FCM_SERVICE_ACCOUNT"
          echo "synced $synced; not set in the secrets store:${skipped:- none}"
          [ -n "$skipped" ] && echo "::warning::these push credentials are still missing:$skipped — the platform stays unavailable until they are set"
          { echo "### sync-push-credentials"; echo; echo "synced $synced variable(s); missing:${skipped:- none}"; } >> "$GITHUB_STEP_SUMMARY"

      # The self-hosted voice. TTS_SERVICE_URL is not a secret, but the bearer
      # that fronts it is, and the two are useless apart — so they are set
      # together and the secret never leaves the secrets store.
      - name: Sync TTS service
        if: (inputs.action || github.event.client_payload.action) == 'sync-tts'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TTS_SERVICE_SECRET: ${{ secrets.TTS_SERVICE_SECRET }}
          TTS_PUBLIC_BASE_URL: ${{ vars.TTS_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          [ -n "$VERCEL_TOKEN" ] || { echo "::error::VERCEL_TOKEN secret is missing"; exit 1; }
          [ -n "$TTS_SERVICE_SECRET" ] || { echo "::error::TTS_SERVICE_SECRET secret is missing"; exit 1; }
          [[ "$TTS_PUBLIC_BASE_URL" =~ ^https://[A-Za-z0-9.-]+(/[A-Za-z0-9._~-]+)*/?$ ]] || { echo "::error::TTS_PUBLIC_BASE_URL variable must be an https URL"; exit 1; }
          echo "::add-mask::$TTS_SERVICE_SECRET"
          url="${TTS_PUBLIC_BASE_URL%/}"
          cd frontend
          set_env() {
            local name=$1 value=$2
            for target in production preview; do
              npx --yes vercel@latest env rm "$name" "$target" --yes --token "$VERCEL_TOKEN" >/dev/null 2>&1 || true
              printf '%s' "$value" | npx --yes vercel@latest env add "$name" "$target" --token "$VERCEL_TOKEN" >/dev/null
            done
            echo "  $name -> production, preview"
          }
          echo "pointing the API at the self-hosted speech service:"
          set_env TTS_SERVICE_URL "$url"
          set_env TTS_SERVICE_SECRET "$TTS_SERVICE_SECRET"
          # Proves the URL is actually serving before the deployment starts
          # trusting it. 401 is the right answer here: the service is up and
          # refusing an unauthenticated caller.
          code=$(curl -s -o /dev/null -m 20 -w '%{http_code}' "$url/health" || echo 000)
          case "$code" in
            401|403) echo "reachable and closed to anonymous callers ($code)";;
            200) echo "::warning::$url/health answered 200 without a bearer token — the service is open to anyone";;
            *) echo "::error::$url/health answered $code; the API would fall back to the carrier voice"; exit 1;;
          esac
          { echo "### sync-tts"; echo; echo "TTS_SERVICE_URL set to $url; health answered $code"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Redeploy production
        if: (inputs.action || github.event.client_payload.action) == 'redeploy' || (inputs.action || github.event.client_payload.action) == 'sync-push-credentials' || (inputs.action || github.event.client_payload.action) == 'sync-tts' || (((inputs.action || github.event.client_payload.action) == 'set' || (inputs.action || github.event.client_payload.action) == 'delete') && (inputs.redeploy || github.event.client_payload.redeploy))
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$VERCEL_TOKEN" ] || { echo "::error::VERCEL_TOKEN secret is missing (Settings → Secrets and variables → Actions)"; exit 1; }
          # Deploy from the repository root. The Vercel project's Root Directory is
          # already "frontend", so running this from inside frontend/ makes the CLI
          # resolve frontend/frontend and fail with "the provided path does not exist".
          npx --yes vercel@latest pull --yes --environment production --token "$VERCEL_TOKEN" >/dev/null
          url=$(npx --yes vercel@latest deploy --prod --yes --env "VOCIVO_RELEASE_SHA=$GITHUB_SHA" --token "$VERCEL_TOKEN" | tail -n 1)
          echo "deployed: $url"
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --max-time 10 "${url%/}/api/health?deep=1" -o /tmp/release-health.json &&
              node -e 'const h=require("/tmp/release-health.json");process.exit(h.ok===true && h.storage?.status==="available" && h.revision===process.env.GITHUB_SHA ? 0 : 1)'; then
              echo "health: API, PostgreSQL and release revision verified"; exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "::error::deployment failed API, database or release revision verification"
          exit 1
